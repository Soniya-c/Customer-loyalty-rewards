{% extends "base.html" %}{% block content %}<section class="panel"><h1>New code batch</h1><p class="notice warning">Copy or download these now. For security, the raw codes will not be shown again.</p><textarea id="codes" readonly rows="14">{% for code in codes %}{{ code }}{% if not loop.last %}\n{% endif %}{% endfor %}</textarea><button onclick="navigator.clipboard.writeText(document.getElementById('codes').value)">Copy all codes</button> <a href="/admin">Return to dashboard</a></section>{% endblock %}
